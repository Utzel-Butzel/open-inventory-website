<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">QZ Tray setup on the printing computer</title><desc id="desc">The browser, QZ Tray and the RAW print queue are on one computer connected to the Brother PT-P710BT by USB. Install QZ, create the queue, connect and test.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6748b8"/></marker></defs>
<rect width="960" height="680" rx="22" fill="#f7f5fb"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="36" y="48" font-size="18" fill="#6748b8" font-weight="700">DIRECT PRINTING</text><text x="36" y="91" font-size="32" fill="#232132" font-weight="700">QZ Tray runs beside your browser</text><rect x="28" y="125" width="904" height="278" rx="16" fill="#eee9f8" stroke="#c4b5e1" stroke-width="2"/><text x="52" y="165" font-size="20" fill="#6748b8" font-weight="700">YOUR PRINTING COMPUTER</text><rect x="52" y="190" width="238" height="123" rx="16" fill="white" stroke="#dcd6eb" stroke-width="2"/><text x="71" y="232" font-size="26" fill="#232132" font-weight="700">Open Inventory</text><text x="71" y="274" font-size="20" fill="#625e73" font-weight="400">Desktop browser</text><rect x="327" y="190" width="235" height="123" rx="16" fill="white" stroke="#dcd6eb" stroke-width="2"/><text x="346" y="232" font-size="26" fill="#232132" font-weight="700">QZ Tray</text><text x="346" y="274" font-size="20" fill="#625e73" font-weight="400">Running locally</text><rect x="599" y="190" width="308" height="123" rx="16" fill="white" stroke="#dcd6eb" stroke-width="2"/><text x="618" y="232" font-size="26" fill="#232132" font-weight="700">Printer queue</text><text x="618" y="274" font-size="20" fill="#625e73" font-weight="400">Brother_PT_P710BT_RAW</text><path d="M297 250H318" stroke="#6748b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M569 250H590" stroke="#6748b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="52" y="365" font-size="22" fill="#625e73" font-weight="400">The Inventory web server can be hosted elsewhere.</text><path d="M752 314V440" stroke="#6748b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="679" y="364" width="145" height="38" rx="9" fill="#f7f5fb" stroke="none" stroke-width="2"/><text x="701" y="391" font-size="21" fill="#6748b8" font-weight="700">USB cable</text><rect x="583" y="452" width="324" height="149" rx="16" fill="white" stroke="#dcd6eb" stroke-width="2"/><text x="607" y="493" font-size="26" fill="#232132" font-weight="700">Brother PT-P710BT</text><text x="607" y="532" font-size="22" fill="#625e73" font-weight="400">Power on · tape loaded</text><text x="607" y="569" font-size="20" fill="#625e73" font-weight="400">Select its actual tape width.</text><circle cx="54" cy="452" r="21" fill="#6748b8"/><text x="48" y="460" font-size="23" fill="white" font-weight="700">1</text><text x="88" y="447" font-size="23" fill="#232132" font-weight="700">Install + start QZ</text><text x="88" y="476" font-size="20" fill="#625e73" font-weight="400">Use the installer for your OS.</text><circle cx="54" cy="521" r="21" fill="#6748b8"/><text x="48" y="529" font-size="23" fill="white" font-weight="700">2</text><text x="88" y="516" font-size="23" fill="#232132" font-weight="700">Create the RAW queue</text><text x="88" y="545" font-size="20" fill="#625e73" font-weight="400">Keep P710BT in the queue name.</text><circle cx="54" cy="590" r="21" fill="#6748b8"/><text x="48" y="598" font-size="23" fill="white" font-weight="700">3</text><text x="88" y="585" font-size="23" fill="#232132" font-weight="700">Connect + test</text><text x="88" y="614" font-size="20" fill="#625e73" font-weight="400">Labels → Connect QZ Tray.</text><text x="36" y="653" font-size="22" fill="#625e73" font-weight="400">No browser print dialog. QZ approval prompts may still appear.</text></g></svg>