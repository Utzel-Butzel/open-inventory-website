<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">Label sheet positions and print settings</title><desc id="desc">Example three-column sheet. The first row is used. Position four starts the second row. Copy stock dimensions and print at actual size with headers and footers off.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6748b8"/></marker></defs>
<rect width="960" height="680" rx="22" fill="#f7f5fb"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="36" y="48" font-size="18" fill="#6748b8" font-weight="700">BROWSER PRINTING</text><text x="36" y="91" font-size="32" fill="#232132" font-weight="700">Match the sheet. Keep the scale.</text><rect x="54" y="130" width="392" height="476" rx="16" fill="white" stroke="#dcd6eb" stroke-width="2"/><text x="75" y="165" font-size="18" fill="#625e73" font-weight="700">EXAMPLE · 3 COLUMNS</text><rect x="83" y="197" width="94" height="70" rx="8" fill="#e9e7ee" stroke="#d4cce5" stroke-width="2"/><text x="118" y="240" font-size="26" fill="#625e73" font-weight="700">1</text><rect x="195" y="197" width="94" height="70" rx="8" fill="#e9e7ee" stroke="#d4cce5" stroke-width="2"/><text x="230" y="240" font-size="26" fill="#625e73" font-weight="700">2</text><rect x="307" y="197" width="94" height="70" rx="8" fill="#e9e7ee" stroke="#d4cce5" stroke-width="2"/><text x="342" y="240" font-size="26" fill="#625e73" font-weight="700">3</text><rect x="83" y="288" width="94" height="70" rx="8" fill="#6748b8" stroke="#d4cce5" stroke-width="2"/><text x="118" y="331" font-size="26" fill="white" font-weight="700">4</text><rect x="195" y="288" width="94" height="70" rx="8" fill="#faf9fd" stroke="#d4cce5" stroke-width="2"/><text x="230" y="331" font-size="26" fill="#232132" font-weight="700">5</text><rect x="307" y="288" width="94" height="70" rx="8" fill="#faf9fd" stroke="#d4cce5" stroke-width="2"/><text x="342" y="331" font-size="26" fill="#232132" font-weight="700">6</text><rect x="83" y="379" width="94" height="70" rx="8" fill="#faf9fd" stroke="#d4cce5" stroke-width="2"/><text x="118" y="422" font-size="26" fill="#232132" font-weight="700">7</text><rect x="195" y="379" width="94" height="70" rx="8" fill="#faf9fd" stroke="#d4cce5" stroke-width="2"/><text x="230" y="422" font-size="26" fill="#232132" font-weight="700">8</text><rect x="307" y="379" width="94" height="70" rx="8" fill="#faf9fd" stroke="#d4cce5" stroke-width="2"/><text x="342" y="422" font-size="26" fill="#232132" font-weight="700">9</text><rect x="83" y="470" width="94" height="70" rx="8" fill="#faf9fd" stroke="#d4cce5" stroke-width="2"/><text x="118" y="513" font-size="26" fill="#232132" font-weight="700">10</text><rect x="195" y="470" width="94" height="70" rx="8" fill="#faf9fd" stroke="#d4cce5" stroke-width="2"/><text x="230" y="513" font-size="26" fill="#232132" font-weight="700">11</text><rect x="307" y="470" width="94" height="70" rx="8" fill="#faf9fd" stroke="#d4cce5" stroke-width="2"/><text x="342" y="513" font-size="26" fill="#232132" font-weight="700">12</text><text x="85" y="589" font-size="22" fill="#625e73" font-weight="400">Read across each row →</text><text x="500" y="317" font-size="24" fill="#6748b8" font-weight="700">First free position: 4</text><text x="500" y="346" font-size="21" fill="#625e73" font-weight="400">Skip used labels on sheet 1.</text><text x="500" y="168" font-size="23" fill="#232132" font-weight="700">1  Copy the stock dimensions</text><text x="500" y="203" font-size="21" fill="#625e73" font-weight="400">Paper and label width / height</text><text x="500" y="233" font-size="21" fill="#625e73" font-weight="400">Rows, columns, gaps and margins</text><text x="500" y="419" font-size="23" fill="#232132" font-weight="700">2  Check the print dialog</text><text x="500" y="454" font-size="20" fill="#625e73" font-weight="400">Scale</text><text x="500" y="479" font-size="22" fill="#6748b8" font-weight="700">100% / Actual size</text><text x="500" y="514" font-size="20" fill="#625e73" font-weight="400">Paper</text><text x="500" y="539" font-size="22" fill="#6748b8" font-weight="700">Same as preview</text><text x="500" y="574" font-size="20" fill="#625e73" font-weight="400">Headers / footers</text><text x="500" y="599" font-size="22" fill="#6748b8" font-weight="700">Off</text><text x="36" y="651" font-size="22" fill="#625e73" font-weight="400">Test on plain paper first. Measure the 5 mm ticks in “Test scale”.</text></g></svg>