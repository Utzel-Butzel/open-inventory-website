<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">Three ways to print</title><desc id="desc">Comparison of local browser printing, direct USB printing through QZ Tray, and shared printing through Inventory Print Agent.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6748b8"/></marker></defs>
<rect width="960" height="680" rx="22" fill="#f7f5fb"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="36" y="48" font-size="18" fill="#6748b8" font-weight="700">THREE WAYS TO PRINT</text><text x="36" y="91" font-size="32" fill="#232132" font-weight="700">Choose the path to your printer</text><rect x="28" y="122" width="904" height="152" rx="16" fill="white" stroke="#dcd6eb" stroke-width="2"/><circle cx="62" cy="157" r="21" fill="#6748b8"/><text x="56" y="165" font-size="23" fill="white" font-weight="700">1</text><text x="98" y="164" font-size="25" fill="#232132" font-weight="700">Browser / PDF</text><text x="48" y="199" font-size="20" fill="#625e73" font-weight="400">Your computer · PDF download also available in preview</text><rect x="48" y="216" width="210" height="42" rx="9" fill="#eee9f8" stroke="none" stroke-width="2"/><text x="63" y="245" font-size="21" fill="#6748b8" font-weight="700">Preview</text><path d="M265 237H286" stroke="#6748b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="294" y="216" width="240" height="42" rx="9" fill="#eee9f8" stroke="none" stroke-width="2"/><text x="309" y="245" font-size="21" fill="#6748b8" font-weight="700">Print dialog</text><path d="M541 237H562" stroke="#6748b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="570" y="216" width="340" height="42" rx="9" fill="#eee9f8" stroke="none" stroke-width="2"/><text x="585" y="245" font-size="21" fill="#6748b8" font-weight="700">System printer</text><rect x="28" y="294" width="904" height="152" rx="16" fill="white" stroke="#dcd6eb" stroke-width="2"/><circle cx="62" cy="329" r="21" fill="#6748b8"/><text x="56" y="337" font-size="23" fill="white" font-weight="700">2</text><text x="98" y="336" font-size="25" fill="#232132" font-weight="700">Direct USB / QZ Tray</text><text x="48" y="371" font-size="20" fill="#625e73" font-weight="400">Your computer · QZ running · PT-P710BT</text><rect x="48" y="388" width="210" height="42" rx="9" fill="#eee9f8" stroke="none" stroke-width="2"/><text x="63" y="417" font-size="21" fill="#6748b8" font-weight="700">Browser</text><path d="M265 409H286" stroke="#6748b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="294" y="388" width="300" height="42" rx="9" fill="#eee9f8" stroke="none" stroke-width="2"/><text x="309" y="417" font-size="21" fill="#6748b8" font-weight="700">QZ + RAW queue</text><path d="M601 409H622" stroke="#6748b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="630" y="388" width="280" height="42" rx="9" fill="#eee9f8" stroke="none" stroke-width="2"/><text x="645" y="417" font-size="21" fill="#6748b8" font-weight="700">USB P-touch</text><rect x="28" y="466" width="904" height="152" rx="16" fill="white" stroke="#dcd6eb" stroke-width="2"/><circle cx="62" cy="501" r="21" fill="#6748b8"/><text x="56" y="509" font-size="23" fill="white" font-weight="700">3</text><text x="98" y="508" font-size="25" fill="#232132" font-weight="700">Shared / Print Agent</text><text x="48" y="543" font-size="20" fill="#625e73" font-weight="400">Any user’s browser · agent on the printer computer</text><rect x="48" y="560" width="210" height="42" rx="9" fill="#eee9f8" stroke="none" stroke-width="2"/><text x="63" y="589" font-size="21" fill="#6748b8" font-weight="700">Browser</text><path d="M265 581H286" stroke="#6748b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="294" y="560" width="270" height="42" rx="9" fill="#eee9f8" stroke="none" stroke-width="2"/><text x="309" y="589" font-size="21" fill="#6748b8" font-weight="700">Inventory server</text><path d="M571 581H592" stroke="#6748b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="600" y="560" width="310" height="42" rx="9" fill="#eee9f8" stroke="none" stroke-width="2"/><text x="615" y="589" font-size="21" fill="#6748b8" font-weight="700">Agent → printer</text><text x="36" y="653" font-size="21" fill="#625e73" font-weight="400">Start with Browser / PDF if your printer already works on this computer.</text></g></svg>